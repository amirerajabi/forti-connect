appId: com.forticonnect.app
productName: FortiConnect
copyright: FortiConnect contributors
directories:
  output: release
  buildResources: build
# In-app updates (src/main/updater.ts, electron-updater): this makes electron-builder write resources/app-update.yml
# into the app and latest.yml / latest-mac.yml / latest-linux.yml next to the installers.
publish:
  provider: github
  owner: amirerajabi
  repo: forti-connect
  releaseType: release
# Package the Electron already installed in node_modules instead of downloading it again from GitHub.
electronDist: node_modules/electron/dist
files:
  - out/**
  - package.json
extraResources:
  - from: ../engine/dist/engine.cjs
    to: engine/engine.cjs
  - from: ../ui/dist
    to: ui
  # An OpenConnect copy to ship with the installer (put openconnect.exe, its DLLs, wintun.dll and vpnc-script-win.js
  # in desktop/core). Without it the app looks for an installed OpenConnect.
  - from: core
    to: core
    filter:
      - '**/*'
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: build/tray.png
    to: tray.png
  - from: build/tray-on.png
    to: tray-on.png
  # Connection badges for the taskbar (Windows) and the Dock (macOS), see updateAppBadge in src/main/main.ts.
  - from: build
    to: .
    filter:
      - badge-*.png
      - dock-*.png
# No spaces in file names: GitHub renames release assets that contain them.
win:
  target: nsis
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Unsigned (ad-hoc) unless Developer ID secrets are configured.
  identity: null
linux:
  target: AppImage
  icon: build/icon.png
  category: Network
  artifactName: ${productName}-${version}-${arch}.${ext}
